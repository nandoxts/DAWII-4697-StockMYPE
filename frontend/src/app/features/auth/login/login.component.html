<main class="pagina-login">
  <div class="contenedor">
    <div class="text-center mb-4">
      <img class="logo d-block mx-auto mb-3" src="logo.svg" alt="StockMYPE" width="64" height="64">
      <h1 class="h4 fw-bold mb-1">Stock<span class="text-primary">MYPE</span></h1>
      <p class="text-body-secondary mb-0">Ingresa para gestionar tu inventario</p>
    </div>

    <form class="card" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <div class="card-body p-4">
        @if (error()) {
          <div class="alert alert-danger py-2 small d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-circle"></i><span>{{ error() }}</span>
          </div>
        }

        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" type="text" class="form-control" [class.is-invalid]="invalido('username')"
                 formControlName="username" autocomplete="username" autofocus>
          <div class="invalid-feedback">Ingresa tu usuario</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group has-validation">
            <input id="password" class="form-control" [class.is-invalid]="invalido('password')"
                   [type]="verPassword() ? 'text' : 'password'" formControlName="password"
                   autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" (click)="verPassword.set(!verPassword())"
                    [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i [class]="verPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
            <div class="invalid-feedback">Ingresa tu contraseña</div>
          </div>
        </div>

        <button class="btn btn-primary w-100" type="submit" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Ingresando…
          } @else {
            Ingresar
          }
        </button>
      </div>
    </form>

    <p class="text-center text-body-secondary small mt-4 mb-0">DAW II (4697) · Cibertec</p>
  </div>
</main>
