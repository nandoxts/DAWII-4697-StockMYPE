<div class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        @for (col of columnas; track col.campo) {
          <th scope="col" class="ordenable" [class.text-end]="col.derecha" (click)="ordenar.emit(col.campo)">
            {{ col.titulo }} <i class="bi small" [class]="'bi small ' + iconoOrden(col.campo)"></i>
          </th>
        }
        <th scope="col" class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (p of productos(); track p.id) {
        <tr>
          <td><code class="text-body-secondary">{{ p.codigo }}</code></td>
          <td>
            <div class="fw-semibold">{{ p.nombre }}</div>
            @if (p.descripcion) { <div class="small text-body-secondary text-truncate desc">{{ p.descripcion }}</div> }
          </td>
          <td><span class="badge rounded-pill bg-primary-subtle text-primary-emphasis">{{ p.categoria }}</span></td>
          <td class="text-end text-nowrap">{{ p.precio | currency:'PEN':'S/ ':'1.2-2' }}</td>
          <td class="text-end"><app-stock-badge [stock]="p.stock" /></td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-outline-primary me-1" title="Editar" (click)="editar.emit(p)">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" title="Eliminar" (click)="eliminar.emit(p)">
              <i class="bi bi-trash3"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
