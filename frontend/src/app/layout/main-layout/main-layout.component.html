<nav class="navbar navbar-expand bg-white border-bottom sticky-top">
  <div class="container-xl">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" routerLink="/productos">
      <span class="logo">S</span>
      StockMYPE
    </a>

    <ul class="navbar-nav me-auto ms-2 d-none d-md-flex">
      <li class="nav-item">
        <a class="nav-link" routerLink="/productos" routerLinkActive="active">Inventario</a>
      </li>
    </ul>

    <!-- Menú de usuario -->
    <div class="menu-usuario ms-auto">
      <button type="button" class="btn btn-link usuario" (click)="alternarMenu($event)"
              [attr.aria-expanded]="menuAbierto()" aria-haspopup="true">
        <span class="avatar">{{ inicial() }}</span>
        <span class="d-none d-sm-inline">{{ sesion()?.nombre }}</span>
        <i class="bi bi-chevron-down small"></i>
      </button>

      @if (menuAbierto()) {
        <div class="dropdown-menu show menu" role="menu" (click)="$event.stopPropagation()">
          <div class="px-3 py-2">
            <div class="fw-medium">{{ sesion()?.nombre }}</div>
            <div class="small text-body-secondary">{{ sesion()?.username }} · {{ sesion()?.rol }}</div>
          </div>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item" role="menuitem" (click)="cerrarSesion()">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
          </button>
        </div>
      }
    </div>

  <router-outlet />

<footer class="py-3 small text-body-secondary">
  <div class="container-xl d-flex justify-content-between flex-wrap gap-2">
