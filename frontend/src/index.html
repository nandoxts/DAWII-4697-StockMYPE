<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>StockMYPE</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#047857">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    /* Pantalla de arranque: se ve mientras Angular carga, así no hay pantallazo en blanco */
    body { margin: 0; background: #f4faf7; }
    .arranque { position: fixed; inset: 0; display: grid; place-items: center; }
    .arranque-caja { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .arranque-logo { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 8px 20px rgba(4, 120, 87, .3); }
    .arranque-barra { width: 120px; height: 3px; border-radius: 3px; background: #d1fae5; overflow: hidden; }
    .arranque-barra::after {
      content: ''; display: block; width: 40%; height: 100%; background: #059669; border-radius: 3px;
      animation: arranque 1s ease-in-out infinite;
    }
    @keyframes arranque { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <app-root>
    <div class="arranque">
      <div class="arranque-caja">
        <img class="arranque-logo" src="logo.svg" alt="StockMYPE">
        <div class="arranque-barra"></div>
      </div>
    </div>
  </app-root>
</body>
</html>
